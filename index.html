/* Layout: OneNote-like — section tabs on top, chantier list on the left, the open fiche on the right. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --sunk:#eceeea; --line:#d9ddd6; --line-strong:#b9bfb5;
  --fg:#1d2420; --muted:#5f6a63; --faint:#8a948d;
  --accent:#1f5fa8; --accent-soft:#e3ecf7; --accent-fg:#ffffff;
  --travaux:#3d7bc6; --travaux-soft:#dfeaf7; --etudes:#d9a21b; --etudes-soft:#faf0d4;
  --red:#c2271f; --red-soft:#fbe5e3; --ok:#2f7d4a; --ok-soft:#e1f1e6; --warn:#a86a00; --warn-soft:#fbeed3;
  --hl:#fff27a; --hl-fg:#1d2420; --cyan:#4fe3f0;
  --ready:#1e7a3c; --ready-hover:#18672f; --ready-edge:#7fd69a;
  --travaux-bg:#dfeaf6; --travaux-side:#eef4fb; --etudes-bg:#fbe6cf; --etudes-side:#fdf2e6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211e; --sunk:#232925; --line:#323a35; --line-strong:#4a544e;
  --fg:#e6ebe7; --muted:#a2ada6; --faint:#77827b;
  --accent:#6aa5ec; --accent-soft:#1d2d42; --accent-fg:#0c1420;
  --travaux:#6aa5ec; --travaux-soft:#1d2d42; --etudes:#e8b940; --etudes-soft:#3a2f12;
  --red:#ff7b70; --red-soft:#3d1c1a; --ok:#6cc58b; --ok-soft:#183324; --warn:#f0b54a; --warn-soft:#3a2a10;
  --hl:#6b6214; --hl-fg:#fff8c2; --cyan:#1b6f78; --travaux-bg:#14202e; --travaux-side:#18232f; --etudes-bg:#2b1d10; --etudes-side:#2a2016; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211e; --sunk:#232925; --line:#323a35; --line-strong:#4a544e;
  --fg:#e6ebe7; --muted:#a2ada6; --faint:#77827b;
  --accent:#6aa5ec; --accent-soft:#1d2d42; --accent-fg:#0c1420;
  --travaux:#6aa5ec; --travaux-soft:#1d2d42; --etudes:#e8b940; --etudes-soft:#3a2f12;
  --red:#ff7b70; --red-soft:#3d1c1a; --ok:#6cc58b; --ok-soft:#183324; --warn:#f0b54a; --warn-soft:#3a2a10;
  --hl:#6b6214; --hl-fg:#fff8c2; --cyan:#1b6f78; --travaux-bg:#14202e; --travaux-side:#18232f; --etudes-bg:#2b1d10; --etudes-side:#2a2016; color-scheme:dark}
.app[data-tab="travaux"] .main{background:var(--travaux-bg)}
.app[data-tab="etudes"] .main{background:var(--etudes-bg)}
.app[data-tab="travaux"] .side{background:var(--travaux-side)}
.app[data-tab="etudes"] .side{background:var(--etudes-side)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.top{display:flex;align-items:end;gap:12px;padding:10px 16px 0;background:var(--panel);border-bottom:3px solid var(--tabc,var(--travaux));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;padding-bottom:9px;margin-right:8px}
.brand .mark.logo{width:38px;height:38px;background:none;display:block;line-height:0;border-radius:8px;box-shadow:0 1px 3px rgba(11,42,102,.35);border-radius:9px}
.brand .t{letter-spacing:.14em;font-weight:500;font-size:15px}
.brand .t b{font-weight:800;color:var(--accent)}
.brand .mark{width:22px;height:22px;border-radius:4px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 12px var(--mono)}
.tabs{display:flex;gap:4px}
.tab{border:0;border-radius:8px 8px 0 0;padding:8px 18px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px;background:var(--sunk);color:var(--muted)}
.tab[data-t="travaux"].on{background:var(--travaux);color:#fff}
.tab[data-t="etudes"].on{background:var(--etudes);color:#1d2420}
.tab .n{font:500 11px var(--mono);opacity:.75;margin-left:6px}
.top .sp{flex:1}
@media (max-width:1800px){.top .tools .lbl{display:none}}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;padding:0}
.top-ttl{min-width:0;flex:1 1 300px;align-self:center;padding:0 6px 6px;overflow:hidden}
.top-ttl .t1{color:var(--red);font-size:17px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.top-ttl .t2row{display:flex;align-items:center;gap:4px 10px;min-width:0;margin-top:2px;flex-wrap:wrap}
.top-ttl .t2row .chips{flex-wrap:wrap;gap:4px;flex:0 1 auto}
.top-ttl .t2row .chip{font-size:10.5px;padding:1px 7px}
.top-ttl .t2{flex:0 1 auto;min-width:0;max-width:100%;font-size:13.5px;color:var(--fg);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tools{display:flex;gap:6px;padding-bottom:7px;align-items:center}
.save{font-size:12px;color:var(--faint);display:inline-block;width:92px;flex:0 0 92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;transition:opacity .2s}
.save.busy{opacity:.45}
.save.err{color:var(--red)}

.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r);padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.auto-warn{border-color:#d08a00;color:#8a5a00;background:#fff4dc}
.btn.auto-ok{color:#1e6b36}
.auto-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.auto-row b.ok{color:var(--ok)} .auto-row b.err{color:var(--red)}
.btn.ppos{background:var(--red);border-color:var(--red);color:#fff}

/* body grid */
.body{display:grid;grid-template-columns:var(--sidew,320px) 1fr;min-height:0}
.side{position:relative}
.resizer{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
.resizer:hover::after,.resizer.on::after{background:var(--accent)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
.side-head input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 10px;background:var(--bg)}
.list{overflow:auto;padding:6px 0 24px;flex:1}
.diag{display:none}
.grp{margin-top:6px}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:2px solid var(--red);background:var(--panel);text-align:left;padding:10px 14px 7px;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
.grp-h .n{font:700 12px var(--mono)!important;color:var(--red)!important;background:var(--red-soft);padding:1px 7px;border-radius:99px}
.grp-h .chev{transition:transform .15s;display:inline-block}
.grp.closed .chev{transform:rotate(-90deg)}
.grp.closed .items{display:none}
.grp-h .n{font:500 11px var(--mono);color:var(--faint)}
.item{display:block;width:100%;border:0;background:none;text-align:left;padding:7px 14px 7px 26px;border-left:3px solid transparent}
.item:hover{background:var(--sunk)}
.item.on{background:var(--accent-soft);border-left-color:var(--tabc,var(--accent))}
.item .l1{font:500 11.5px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.item .l2{font-weight:500;line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item[draggable="true"]{cursor:grab}
.item.dragging{opacity:.35}
.item.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.items.drop-end{box-shadow:inset 0 -3px 0 var(--accent)}
.item.ready{background:var(--ready);border-left-color:var(--ready-edge)}
.item.ready .l1,.item.ready .l2{color:#fff}
.item.ready:hover{background:var(--ready-hover)}
.item.ready.on{background:var(--ready-hover);border-left-color:#fff;box-shadow:inset 0 0 0 2px var(--ready-edge)}
.item.ready .bar{background:rgba(255,255,255,.25)}
.item.ready .bar i{background:#9fd3ff}
.item.ready .l1::after{content:"PRÊT POUR TRAVAUX";font:700 9.5px var(--sans);letter-spacing:.06em;background:#fff;color:var(--ready);padding:1px 6px;border-radius:99px;margin-left:auto}
.pill{font:600 10px var(--sans);letter-spacing:.05em;padding:1px 6px;border-radius:99px;text-transform:uppercase}
.pill.ppos{background:var(--red-soft);color:var(--red)}
.pill.ppor{background:var(--accent-soft);color:var(--accent)}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

/* main */
.main{overflow:auto;min-width:0;padding-block:20px 60px;padding-inline:clamp(16px,3vw,36px)}
.empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font-weight:600;text-wrap:balance}
.sheet{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:8px}
.head-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.title{color:var(--red);font-size:clamp(20px,2.4vw,28px);font-weight:500;line-height:1.25;text-wrap:balance;margin:0}
.title .ref{font-weight:500}
.title .sub{font-size:.8em}
.meta{color:var(--faint);font-size:12.5px}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
.f input:hover,.f select:hover{border-color:var(--line-strong)}
.f.mono input{font-family:var(--mono)}
.f.wide{grid-column:span 2}
.f{position:relative}
.sugg{position:absolute;top:100%;left:0;right:0;z-index:12;margin-top:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto;min-width:260px}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button.on,.sugg button:hover{background:var(--accent-soft)}
.sugg .s1{font-weight:500}
.sugg .s2{font:400 11.5px var(--mono);color:var(--muted)}
.sugg .sh{padding:5px 10px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);background:var(--sunk)}

h3.sec{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3.sec.red{color:var(--red)}
h3.sec .sp{flex:1}
h3.sec .prog{font:500 12px var(--mono);color:var(--muted);letter-spacing:0;text-transform:none}
.pmeo-t{text-align:center;color:var(--red);font-weight:700;font-size:22px;letter-spacing:.04em;margin:0;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.pmeo-sw{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.pmeo-sw button{border:0;background:var(--panel);color:var(--faint);font:700 15px var(--sans);letter-spacing:.04em;padding:6px 16px;text-transform:uppercase}
.pmeo-sw button+button{border-left:1px solid var(--line-strong)}
.pmeo-sw button.on{background:var(--red-soft);color:var(--red)}
.pmeo-sw button.on.sans{background:var(--sunk);color:var(--fg)}
.pmeo-t .dt{font-size:15px}
.pmeo-sel{border:1px solid transparent;background:transparent;color:var(--red);font:700 22px var(--sans);letter-spacing:.04em;padding:2px 6px;border-radius:6px;cursor:pointer;text-align:center}
.pmeo-sel:hover{border-color:var(--line-strong)}
.pmeo-head{flex:0 1 auto}
.pmeo-head .pmeo-sel{font-size:17px;padding:4px 2px}
.pmeo-sel.sans{color:var(--fg)}
.pmeo-sel.faite,.pmeo-date.faite{color:#1e7a3c}
.adr-row{display:flex;gap:6px;align-items:stretch}
.adr-row input{flex:1;min-width:0}
.btn.emaps{text-decoration:none;color:var(--accent);border-color:var(--accent)}
.btn.racing{text-decoration:none;color:var(--warn);border-color:var(--warn)}
.btn.gmaps{text-decoration:none;color:var(--ok);border-color:var(--ok)}
.btn.cadastre{color:#8a5a00;border-color:#d9a441}
.sig-box{display:flex;flex-direction:column;gap:6px}
.sig-prev{min-height:60px;border:1px dashed var(--line-strong);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;padding:6px}
.sig-prev img{max-height:90px;max-width:100%}
.sig-act{display:flex;gap:6px;flex-wrap:wrap}
.sig-pad canvas{width:100%;max-width:520px;aspect-ratio:520/170;border:1px solid var(--line-strong);border-radius:6px;background:#fff;touch-action:none;cursor:crosshair}
.cad-wrap{position:relative;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:#f4f4f4;cursor:crosshair}
.cad-wrap img{display:block;width:100%;height:auto}
.cad-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cad-info{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.cad-info b{font-weight:600}
.cad-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.maps-btns{display:flex;gap:6px;justify-content:flex-end}
.head-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.head-top{align-items:flex-start}
.head-top .pmeo-head{align-self:center}
.adr-msg{font-size:11.5px;color:var(--ok);min-height:1em}
.insee-row{display:flex;align-items:center;gap:8px}
.insee-row label{white-space:nowrap}
.insee-row input{max-width:140px;font-family:var(--mono)}
.pmeo-date{border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);color:var(--red);font:700 16px var(--sans);padding:3px 6px}
.pmeo-sel option{color:var(--fg);font-size:15px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
table.kv,table.grid{border-collapse:collapse;width:100%;background:var(--panel)}
table.kv td,table.grid td,table.grid th{border:1px solid var(--line-strong);padding:0;vertical-align:middle}
table.kv td:first-child{font-weight:600;padding:6px 8px;width:46%;white-space:nowrap}
table.kv.plan th{text-align:left;padding:6px 8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line-strong);background:var(--panel)}
table.kv.plan td:first-child{padding:0;width:auto;font-weight:400}
table.kv.plan td:last-child{width:42%}
.pd{display:flex;align-items:flex-start}
.pd textarea{flex:1}
textarea.autog{display:block;width:100%;border:0;background:transparent;resize:none;padding:6px 8px;min-height:32px;overflow:hidden;field-sizing:content;line-height:1.4;font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.xdel{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:4px 6px}
.xdel:hover{color:var(--red)}
table.kv td input,table.kv td select,table.grid td input{border:0;background:transparent;width:100%;padding:6px 8px;min-width:0}
table.kv td select{color:var(--red);font-weight:500}
table.kv td select.reg-ppor,table.kv td select.reg-diff,table.kv td select.reg-none{color:var(--fg)}
.regcell{display:flex;align-items:center;flex-wrap:wrap}
.regcell select{flex:1 1 120px}
.regcell .d{display:flex;align-items:center;gap:4px;flex:1 1 150px;padding-left:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.regcell .d input{padding:4px 6px!important;color:var(--fg)}
.regcell .d.red,.regcell .d.red input{color:var(--red);font-weight:500}
.pill.diff{background:var(--sunk);color:var(--fg)}
.lbl-hl{background:var(--hl);color:var(--hl-fg);padding:0 3px}
.lbl-cy{background:var(--cyan);color:var(--hl-fg);padding:0 3px}
.rip-cell{display:flex;align-items:stretch;gap:0}
.rip-v{flex:1;min-width:0;display:flex;flex-direction:column}
.rip-v input{border:0;background:transparent;width:100%;min-width:0;padding:3px 8px}
.rip-v .rip-n{font-weight:600;padding-bottom:0}
.rip-v .rip-t{font-size:12.5px;color:var(--muted,#555);padding-top:0}
.rip-b{align-self:center;margin-right:4px;padding:2px 6px}
.lbl-gr{background:#46d14a;color:#10220f;padding:0 3px}
table.grid th{background:var(--sunk);font-size:12px;font-weight:700;padding:6px 8px;text-align:left}
table.grid th span{background:var(--hl);color:var(--hl-fg);padding:0 3px}
table.grid td.x{width:52px;text-align:center}
.xg{display:flex;align-items:center;justify-content:center;gap:2px}
.grip{cursor:grab;color:var(--faint);font-size:15px;line-height:1;padding:4px 3px;user-select:none;border-radius:4px}
.grip:hover{color:var(--fg);background:var(--sunk)}
tr.row-dragging,.note.row-dragging{opacity:.45}
.note.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.note.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.note .na .grip{padding:2px 4px;font-size:14px}
tr.drop-before>td{box-shadow:inset 0 3px 0 var(--accent)}
tr.drop-after>td{box-shadow:inset 0 -3px 0 var(--accent)}
.tblwrap{overflow-x:auto}
table.grid{min-width:560px}
.prm-box{padding:10px 12px 12px;max-width:620px}
table.grid.prm{min-width:0}
table.grid.prm th{text-align:center}
table.grid.prm td input{text-align:center}
table.grid.prm th:nth-child(1),table.grid.prm th:nth-child(2){width:24%}
.x button{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:4px}
.x button:hover{color:var(--red)}

.notes{display:flex;flex-direction:column;border:1px solid var(--line-strong);background:#fff}
.note{display:flex;align-items:start;border-bottom:1px solid var(--line-strong)}
.note:last-child{border-bottom:0}
.note textarea{flex:1;border:0;background:transparent;resize:none;padding:6px 8px;min-height:38px;field-sizing:content;overflow:hidden;color:var(--red);font-size:20px;line-height:1.35}
.note.imp textarea{font-weight:700;background:#fff;color:var(--red)}
.note .na{display:flex;gap:0;padding:4px 2px}
.note .nb{flex:1;min-width:0;display:flex;flex-direction:column}
.note .na .tk{font-size:12px;opacity:.55}
.note .na .tk.on{opacity:1;background:var(--accent-soft)}
.task-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:0 8px 6px;font-size:12px;color:var(--muted)}
.task-row input[type=date]{font-size:12px;padding:1px 4px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel)}
.task-row .tdl{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.task-row .tj{font-weight:700}
.task-row .tj.red{color:var(--red)} .task-row .tj.warn{color:var(--warn)} .task-row .tj.blue{color:var(--accent)} .task-row .tj.ok{color:var(--ok)}
.note.task{background:linear-gradient(90deg,var(--accent-soft) 0 4px,transparent 4px)}
.note.tdone textarea{text-decoration:line-through;opacity:.55}
.note .na button{border:0;background:none;color:var(--faint);padding:2px 5px;border-radius:4px;font-size:13px}
.note .na button:hover{background:var(--sunk);color:var(--fg)}
.note.imp .na .imp{color:var(--red)}

/* ---------- Sauvegarde ---------- */
function setSave(){
  const el=$("#save");
  if(!db){ el.textContent="Aperçu (non enregistré)"; el.className="save"; return; }
  if(lastErr){ el.textContent="Erreur d'enregistrement"; el.className="save err"; el.title=lastErr; return; }
  // texte fixe (la largeur ne change pas pendant la frappe) : seule l'opacité indique l'enregistrement en cours
  el.className="save"+(pending?" busy":""); el.title=pending?"Enregistrement…":"Toutes les modifications sont enregistrées"; if(el.textContent!=="Enregistré ✓") el.textContent="Enregistré ✓";
}
function scheduleSave(id, delay=700){
  const c=chantiers.get(id); if(!c) return;
  c.updated=today();
  if(!db) return;
  clearTimeout(timers[id]); if(!timers[id+"_p"]){ timers[id+"_p"]=1; pending++; } setSave();
  timers[id]=setTimeout(()=>{
    timers[id+"_p"]=0;
    const body=JSON.parse(JSON.stringify(chantiers.get(id)||{}));
    chains[id]=(chains[id]||Promise.resolve()).then(()=>db.collection("chantiers").doc(id).set(body))
      .then(()=>{lastErr=null;},e=>{lastErr=e?.message||String(e);})
      .finally(()=>{pending=Math.max(0,pending-1); setSave();});
  },delay);
}
async function saveSettings(){
  if(!db) return;
  pending++; setSave();
  try{ await db.doc("config/settings").set(JSON.parse(JSON.stringify(settings))); lastErr=null; }
  catch(e){ lastErr=e?.message||String(e); }
  finally{ pending--; setSave(); }
}

/* Place un chantier en dernier dans son groupe (type + statut) */
function placeLast(id,first){
  const c=chantiers.get(id); if(!c) return;
  const grp=[...chantiers.entries()].filter(([k,x])=>k!==id && x.type===c.type && (x.statut===c.statut || (!STATUTS[c.type].includes(x.statut) && c.statut===STATUTS[c.type][0])))
    .sort((a,b)=>((a[1].ordre??1e9)-(b[1].ordre??1e9)) || (a[1].dc||a[1].rac||"zz").localeCompare(b[1].dc||b[1].rac||"zz"));
  grp.forEach(([k,x],i)=>{ const o=(i+(first?2:1))*10; if(x.ordre!==o){ x.ordre=o; scheduleSave(k,200); } });
  c.ordre=first?10:(grp.length+1)*10;
}

/* ---------- Règles d'alerte communes (pastilles + récap) ---------- */
const DAYMS=864e5;
function dd0(){ const n=new Date(); n.setHours(0,0,0,0); return n; }
function isoD(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function jDebut(c){ const d=isoD(c.date_debut); return d?Math.round((d-dd0())/DAYMS):null; } // jours avant le début des travaux
function etudeAttendue(c){ return !!c.bet_retour && !c.bet_ok; } // étude affectée, retour pas encore OK
function retardEtude(c){ const d=isoD(c.bet_retour); return etudeAttendue(c) && d && d<dd0(); }
function alerteDMR(c){ const j=jDebut(c); return c.type==="travaux" && !c.checks?.mat?.d && j!=null && j<=60; }
function alerteC21(c){ const j=jDebut(c); return c.type==="travaux" && !c.checks?.c21?.d && j!=null && j<=40; }
function alerteFDO(c){ const j=jDebut(c); return c.type==="travaux" && !c.checks?.fdo2?.d && j!=null && j<=40; }
/* Devis : expire 3 mois après l'envoi ; alerte « bientôt expiré » à 2 mois et 15 jours ; « Retour devis payé » coché = plus d'alerte */
function devisInfo(c){ if(c.type!=="etudes") return null; const st=c.checks?.devis; if(!st?.d||c.checks?.retdevis?.d) return null; const d0=isoD(st.at); if(!d0) return {nodate:true};
  const exp=new Date(d0); exp.setMonth(exp.getMonth()+3); const w=new Date(d0); w.setMonth(w.getMonth()+2); w.setDate(w.getDate()+15);
  const t=dd0(); return {d0,exp,j:Math.round((exp-t)/DAYMS),lvl:t>=exp?2:t>=w?1:0}; }
function devisTxt(v,long){ if(v.nodate) return "Devis : date d'envoi ?"; const dm=d=>long?d.toLocaleDateString("fr-FR"):frDate(isoLocal(d)).slice(0,5);
  return v.lvl===2?`Devis expiré (envoyé le ${dm(v.d0)})`:`${v.lvl===1?"Devis bientôt expiré":"Devis"} ${long?"envoyé le ":""}${dm(v.d0)} · J-${v.j}`; }
function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
/* Notes transformées en tâches : date « pour le », case « fait », compte à rebours */
function taskJ(n){ const d=isoD(n.due); return d?Math.round((d-dd0())/DAYMS):null; }
function tasksOf(c){ return (c.notes||[]).filter(n=>n.task&&!n.done&&(n.t||"").trim()); }
function taskWhen(j){ return j==null?"date ?":j<0?`en retard de ${-j} j`:j===0?"aujourd'hui":`J-${j}`; }
function taskRow(n,i){ const j=taskJ(n);
  return `<div class="task-row"><span>⏰ pour le</span><input type="date" data-p="notes.${i}.due" value="${esc(n.due||"")}" aria-label="Date de la tâche"><label class="tdl"><input type="checkbox" data-ntd="${i}" ${n.done?"checked":""}> fait</label>${n.done?`<span class="tj ok">✓ faite</span>`:`<span class="tj ${j==null?"warn":j<=0?"red":j<=3?"warn":"blue"}">${taskWhen(j)}</span>`}</div>`; }
function taskChip(c){ const ts=tasksOf(c); if(!ts.length) return null;
  const withD=ts.filter(n=>isoD(n.due)).sort((a,b)=>isoD(a.due)-isoD(b.due)); const n=withD[0]; const more=ts.length>1?` (+${ts.length-1})`:"";
  if(!n) return ["warn","Tâche : date ?"+more]; const j=taskJ(n);
  return [j<=0?"red":j<=3?"warn":"blue",(j<0?"Tâche en retard":j===0?"Tâche aujourd'hui":`Tâche ${frDate(n.due).slice(0,5)} · J-${j}`)+more]; }
function taskAlerts(c,cut){ return tasksOf(c).sort((x,y)=>(isoD(x.due)||9e15)-(isoD(y.due)||9e15)).map(n=>{ const j=taskJ(n), d=isoD(n.due);
  return [j!=null&&j<=3?"⏰":"🗓",`tâche : ${cut((n.t||"").trim().replace(/\s+/g," "),70)} – ${d?"pour le "+d.toLocaleDateString("fr-FR")+" ("+taskWhen(j)+")":"sans date"}`,1]; }); }
function stateChips(c,mini=false){
  const ch=[]; const d=x=>frDate(x).slice(0,5);
  { const t=taskChip(c); if(t) ch.push(t); }
  { const v=devisInfo(c); if(v) ch.push([v.nodate?"warn":v.lvl?"red":"blue",devisTxt(v)]); }
  if(c.bet_ok && !c.checks?.rip?.d) ch.push(["red","À programmer"]); // retour étude OK mais dates RIP pas bloquées
  if(c.regime==="PPOS") ch.push(["red","PPOS à diffuser"]); else if(c.regime==="PPOS diffusé") ch.push(["ok","PPOS diffusé"+(c.regime_date?" "+d(c.regime_date):"")]); else if(c.regime==="PPOR") ch.push(["blue","PPOR"]); else if(!mini) ch.push(["mute","Régime ?"]);
  const att=etudeAttendue(c);
  if(retardEtude(c)) ch.push(["red","Retard étude"]); else if(att&&!mini) ch.push(["mute","Étude en attente"]);
  if(c.icp==="Faite") ch.push(["ok","ICP faite"+(c.icp_faite?" "+d(c.icp_faite):"")]); else if(att){} else if(c.icp==="Invitation envoyée") ch.push(["warn","ICP invitée"]); else if(c.icp==="A faire") ch.push(["warn","ICP à faire"]); else if(!mini) ch.push(["mute","ICP ?"]);
  if(!mini){ if(c.prescriptions==="oui"){ if(!att) ch.push(["red","Prescriptions"]); } else if(c.prescriptions==="demandées") ch.push(["warn","Prescriptions demandées"+(c.presc_dem?" "+d(c.presc_dem):"")]); else if(c.prescriptions==="retour ok") ch.push(["ok","Prescriptions OK"]); else if(c.prescriptions==="non") ch.push(["mute","Sans prescriptions"]); }
  if(c.pmeo_mode==="le") ch.push(["red","PMEO"+(c.pmeo?" "+d(c.pmeo):" (date ?)")]); else if(c.pmeo_mode==="faite") ch.push(["ok","PMEO faite"+(c.pmeo?" "+d(c.pmeo):"")]); else if(c.pmeo_mode==="sans") ch.push(["ok","SANS PMEO"]); else if(!mini) ch.push(["mute","PMEO ?"]);
  if(alerteDMR(c)) ch.push(["red","DMR à faire"]);
  if(alerteC21(c)) ch.push(["red","Consultation 21 j"]);
  if(alerteFDO(c)) ch.push(["red","FDO au BEX"]);
  if(c.checks?.pret?.d) ch.push(["ready","Prêt pour travaux"]);
  return ch.filter(([k,t])=>k!=="ok"||t.startsWith("PPOS diffusé")||t.startsWith("PMEO faite")||t==="SANS PMEO").map(([k,t])=>`<span class="chip ${k}">${esc(t)}</span>`).join("");
}

        <div class="l3">${["Travaux terminés","Archive"].includes(c.statut)?((t=>t?`<span class="chip ${t[0]}">${esc(t[1])}</span>`:"<span></span>")(taskChip(c))):stateChips(c,true)}<span class="pct">${pr.p} %</span></div>

function setPath(obj,path,val){ const ks=path.split("."); let o=obj; for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k]={}; o=o[k]; } o[ks.at(-1)]=val; }

$("#main").addEventListener("input",e=>{

$("#main").addEventListener("change",e=>{
  const c=chantiers.get(currentId); if(!c) return;

  if(e.target.dataset.ck){ const id=e.target.dataset.ck; const st=c.checks[id]||{}; st.d=e.target.checked; st.at=st.d?today():""; c.checks[id]=st; scheduleSave(currentId,200); renderMain(); renderList(); return; }
  const p=e.target.dataset.p;
  if(p==="statut"){ placeLast(currentId, c.statut==="Travaux terminés"||c.statut==="Archive"); scheduleSave(currentId,100); renderList(); }
  if(p==="regime" && c.regime==="PPOS diffusé" && !c.regime_date){ c.regime_date=today(); scheduleSave(currentId,100); }
  if(p==="regime_date") renderList();

});

  const em=e.target.closest("[data-emaps]");
  if(em){ const c=chantiers.get(currentId); const a=c?fullAddr(c):""; const msg=$("#adr_msg");
    em.href=emapsUrl(c);

        if(x && x.score>=0.4 && typeof x.lat==="number"){ c.gps=`${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}`; c.gps_src="auto"; c.gps_for=c.adresse; if(!c.insee) c.insee=x.insee; scheduleSave(currentId,100); const g=$("#f_gps"); if(g) g.value=c.gps; if(msg) msg.textContent="e-Maps ouvert sur l'adresse ("+x.label+")."; }
        else if(msg){ msg.style.color="var(--muted)"; msg.textContent="Adresse introuvable en ligne : e-Maps ouvert sur la commune."; }
        const url=emapsUrl(c); if(w) w.location.href=url; else window.open(url,"_blank"); });
      return; }
    if(a){ try{ navigator.clipboard.writeText(a).then(()=>{ if(msg) msg.textContent=parseGps(c.gps)?"e-Maps ouvert sur l'adresse (adresse copiée aussi).":"e-Maps ouvert sur la commune. Adresse copiée : colle-la (Ctrl+V) dans la recherche pour zoomer."; },()=>{ if(msg){ msg.style.color="var(--muted)"; msg.textContent="Copie automatique bloquée : sélectionne l'adresse et fais Ctrl+C."; } }); }catch{} }
    return; }
  const b=e.target.closest("[data-a]"); if(!b) return;
  const c=chantiers.get(currentId); if(!c) return;
  const a=b.dataset.a, i=+b.dataset.i;

  if(a==="noteadd"){ c.notes.push({t:"",imp:false}); }
  else if(a==="notedel"){ c.notes.splice(i,1); if(!c.notes.length) c.notes.push({t:"",imp:false}); }
  else if(a==="noteimp"){ c.notes[i].imp=!c.notes[i].imp; }
  else if(a==="notetask"){ const n=c.notes[i]; if(n.task){ delete n.task; delete n.due; delete n.done; } else { n.task=true; n.due=n.due||""; n.done=false; } }
  else if(a==="rowadd"){ const l=b.dataset.l; c[l].push(l==="contacts"?{nom:"",raison:"",tel:"",mail:""}:l==="prm"?{bat:"",lot:"",prm:""}:{etape:"",date:""}); }
  else if(a==="rowdel"){ c[b.dataset.l].splice(i,1); if(b.dataset.l==="prm"&&!c.prm.length) c.prm.push({bat:"",lot:"",prm:""}); }
  else if(a==="move"){ c.type = c.type==="etudes"?"travaux":"etudes"; c.statut=STATUTS[c.type][0]; tab=c.type; placeLast(currentId); remember(currentId); scheduleSave(currentId,100); renderList(); renderMain(); return; }
  else if(a==="pmeo"){ c.pmeo_mode = c.pmeo_mode===b.dataset.v ? "" : b.dataset.v; }
  else if(a==="annu"){ openAnnuaire(); return; }

  else if(a==="betok"){ c.bet_ok=today(); }

/* Adresse complète (rue + code postal + commune) -> commune et code INSEE déduits */
let sug={el:null,items:[],idx:-1,field:null};
function closeSugg(){ sug.el?.remove(); sug={el:null,items:[],idx:-1,field:null}; }
function parseAddr(text){
  const t=String(text||"");
  const m=/\b(\d{5})\b\s*(.*)$/.exec(t);
  if(m){ const cands=COMMUNES.filter(x=>x.cp===m[1]); const rest=nrm(m[2]);
    if(rest){ const a=cands.filter(x=>x.n===rest)[0]||cands.filter(x=>x.n.startsWith(rest+" ")||x.n.startsWith(rest))[0]; if(a) return a; const f=findCommune(m[2]); if(f) return f; }
    else if(cands.length===1) return cands[0];
  }
  const w=nrm(t).split(" ").filter(Boolean);
  for(let k=Math.min(6,w.length);k>=1;k--){ const f=findCommune(w.slice(-k).join(" ")); if(f) return f; }
  return null;
}
function eplansId(t){ const m=/AffaireRacing\/Index\/(\d+)/i.exec(String(t||""))||/^\s*(\d{5,})\s*$/.exec(String(t||"")); return m?m[1]:null; }
function parseGps(t){ const m=/(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,3}[.,]\d+)/.exec(String(t||"")); if(!m) return null;
  let a=+m[1].replace(",","."), b=+m[2].replace(",",".");
  if(Math.abs(a)<5 && Math.abs(b)>40){ [a,b]=[b,a]; } // l'utilisateur a mis lon, lat
  return (a>40&&a<52&&b>-6&&b<10)?{lat:a,lon:b}:null; }
function emapsUrl(c){
  const base="https://emaps.enedis.fr/";
  if(!c) return base;
  const g=parseGps(c.gps); let lon,lat,dx,dy;
  if(g){ lon=g.lon; lat=g.lat; dx=0.0028; dy=0.0012; }
  else { const k=c.insee||parseAddr(c.adresse)?.insee; const ce=k&&CENTRES[k]; if(!ce) return base; [lon,lat]=ce; dx=0.02; dy=0.009; }
  const f=x=>x.toFixed(6);
  return base+"?extent="+encodeURIComponent([f(lon-dx),f(lat-dy),f(lon+dx),f(lat+dy)].join(","));
}
function hasCommune(c){ const a=c.adresse||""; if(!c.commune) return true; if(/\b\d{5}\b/.test(a)||nrm(a).includes(nrm(c.commune))) return true; const f=parseAddr(a); return !!(f&&c.insee&&f.insee===c.insee); }
function fullAddr(c){ const a=(c.adresse||"").trim(); if(!c.commune||hasCommune(c)) return a; return [a,[c.cp,c.commune].filter(Boolean).join(" ")].filter(Boolean).join(" "); }
function syncAddr(c){
  const f=parseAddr(c.adresse);
  if(f){ c.commune=f.nom.toUpperCase(); c.cp=f.cp; c.insee=f.insee; }
  const i=$("#f_insee"); if(i && f) i.value=c.insee;
}
function tailFragment(v){
  const m=/\b\d{5}\b\s*(.*)$/.exec(v); if(m) return {frag:m[1], start:v.length-m[0].length};
  const words=v.replace(/\s+$/,"").split(" ");
  for(let k=Math.min(3,words.length);k>=1;k--){ const frag=words.slice(-k).join(" "); if(communeSuggestions(frag).length) return {frag,start:v.replace(/\s+$/,"").length-frag.length}; }
  return null;
}
let banTimer=null, banSeq=0;
async function fetchBan(q,limit=5){
  const enc=encodeURIComponent(q);
  const urls=[`https://data.geopf.fr/geocodage/search?q=${enc}&limit=${limit}&index=address`,`https://api-adresse.data.gouv.fr/search/?q=${enc}&limit=${limit}`];
  for(const u of urls){
    try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),4000);
      const r=await fetch(u,{signal:ctl.signal}); clearTimeout(t); if(!r.ok) continue;
      const j=await r.json(); if(!Array.isArray(j.features)) continue;
      return j.features.map(f=>({label:f.properties.label, cp:f.properties.postcode||"", insee:f.properties.citycode||"", city:f.properties.city||"", score:f.properties.score||0, lon:f.geometry?.coordinates?.[0], lat:f.geometry?.coordinates?.[1]})).filter(x=>x.label);
    }catch{}
  }
  return null;
}
function banSearch(input){
  clearTimeout(banTimer); const v=input.value.trim(); if(v.length<4) return;
  banTimer=setTimeout(async()=>{ const seq=++banSeq; const r=await fetchBan(v);
    if(!r||!r.length||seq!==banSeq||input.value.trim()!==v||document.activeElement!==input) return;
    openSugg(input,r); },300);
}
function applyBan(c,x){ c.adresse=x.label; c.cp=x.cp; c.insee=x.insee; if(x.city) c.commune=x.city.toUpperCase();
  if(typeof x.lat==="number"&&typeof x.lon==="number" && (!c.gps||c.gps_src==="auto")){ c.gps=`${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}`; c.gps_src="auto"; c.gps_for=c.adresse; } }
async function autoGps(id){
  const c=chantiers.get(id); if(!c||!c.adresse||!/\d{5}/.test(c.adresse)) return;
  if(c.gps && !(c.gps_src==="auto" && c.gps_for!==c.adresse)) return;
  const r=await fetchBan(c.adresse,1); const x=r&&r[0]; if(!x||x.score<0.5) return;
  const cc=chantiers.get(id); if(!cc||cc.adresse!==c.adresse) return;
  cc.gps=`${x.lat.toFixed(6)}, ${x.lon.toFixed(6)}`; cc.gps_src="auto"; cc.gps_for=cc.adresse; if(!cc.insee) cc.insee=x.insee;
  scheduleSave(id,100); if(id===currentId){ const g=$("#f_gps"); if(g) g.value=cc.gps; }
}
function openSugg(input,ban=[]){
  const c=chantiers.get(currentId); if(!c) return;
  const v=input.value; let items=[];
  items=addressSuggestions(v,currentId).map(x=>({kind:"adr",x,l1:fullAddr(x),l2:x.insee?"INSEE "+x.insee:""}));
  const tf=tailFragment(v);
  if(tf && nrm(tf.frag).length>=2) items=items.concat(communeSuggestions(tf.frag).slice(0,5).map(x=>({kind:"com",x,tf,l1:`${x.cp} ${x.nom}`,l2:`INSEE ${x.insee}`})));
  items=items.concat(ban.map(x=>({kind:"ban",x,l1:x.label,l2:x.insee?"INSEE "+x.insee:""})));
  closeSugg(); if(!items.length) return;
  const box=document.createElement("div"); box.className="sugg"; box.setAttribute("role","listbox");
  let html="", lastKind="";
  items.forEach((it,i)=>{ if(it.kind!==lastKind){ html+=`<div class="sh">${it.kind==="adr"?"Adresses déjà utilisées":it.kind==="ban"?"Base Adresse Nationale":"Compléter avec la commune"}</div>`; lastKind=it.kind; }
    html+=`<button type="button" data-si="${i}"><div class="s1">${esc(it.l1)}</div>${it.l2?`<div class="s2">${esc(it.l2)}</div>`:""}</button>`; });
  box.innerHTML=html; input.parentElement.appendChild(box);
  box.addEventListener("mousedown",e=>{ const b=e.target.closest("[data-si]"); if(!b) return; e.preventDefault(); pickSugg(+b.dataset.si); });
  sug={el:box,items,idx:-1,field:"adresse"};
}
function pickSugg(i){
  const it=sug.items[i]; const c=chantiers.get(currentId); if(!it||!c) return;
  if(it.kind==="adr"){ c.adresse=fullAddr(it.x); }
  else if(it.kind==="ban"){ applyBan(c,it.x); closeSugg(); scheduleSave(currentId,100); renderMain(); renderList(); return; }
  else { const base=(c.adresse||"").slice(0,it.tf.start).replace(/[\s,]+$/,""); c.adresse=(base?base+" ":"")+`${it.x.cp} ${it.x.nom}`; }
  syncAddr(c);
  closeSugg(); scheduleSave(currentId,100); renderMain(); renderList();
}

function fillPpos(values,opt={}){
  const T=window.PPOS_TPL; if(!T) throw {message:"modèle PPOS absent"};
  const bin=atob(T.b64), base=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) base[i]=bin.charCodeAt(i);
  const objs=[];
  for(const [name,val] of Object.entries(values)){ const f=T.fields[name]; if(!f) continue;
    objs.push([f.n,f.g,f.raw.replace(/\n\/V \((?:\\.|[^\\)])*\)/,"\n/V "+pdfStr(val))]); }
  for(const name of (opt.checked||[])){ const bt=T.buttons[name]; if(!bt) continue;
    objs.push([bt.n,bt.g,bt.raw.replace("\n/V /Off","\n/V /Yes")]);
    for(const k of bt.kids) objs.push([k.n,k.g,k.raw.replace("\n/AS /Off","\n/AS /Yes")]); }
  let size=T.size;
  if(opt.sig&&opt.sig.data&&T.sig){ const m=/^data:image\/jpeg;base64,(.+)$/.exec(opt.sig.data);
    if(m){ const jb=atob(m[1]), iw=opt.sig.w|0, ih=opt.sig.h|0, im=size++;
      if(iw>0&&ih>0){
        objs.push([im,0,`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>\nstream\n${jb}\nendstream`]);
        for(const k of Object.keys(T.sig)){ const S=T.sig[k]; const sc=Math.min(S.bw/iw,S.bh/ih), dw=iw*sc, dh=ih*sc, x=(S.bw-dw)/2, y=(S.bh-dh)/2;
          const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im1 Do Q`;
          objs.push([S.form,0,`<< /Type /XObject /Subtype /Form /BBox [0 0 ${S.bw} ${S.bh}] /Resources << /XObject << /Im1 ${im} 0 R >> >> /Length ${cs.length} >>\nstream\n${cs}\nendstream`]); } } } }
  if(opt.pages){ objs.push([T.pages.n,T.pages.g,T.pages.raw.replace(/\/Count \d+/,"/Count "+opt.pages.length).replace(/\/Kids \[[^\]]*\]/,"/Kids [ "+opt.pages.map(n=>n+" 0 R").join(" ")+" ]")]); }
  let out="\n", pos=base.length+1; const offs=[];
  for(const [n,g,raw] of objs){ const obj=`${n} ${g} obj\n${raw}\nendobj\n`; offs.push([n,g,pos]); out+=obj; pos+=obj.length; }
  offs.sort((a,b)=>a[0]-b[0]);
  let x="xref\n"; for(const [n,g,o] of offs) x+=`${n} 1\n${String(o).padStart(10,"0")} ${String(g).padStart(5,"0")} n \n`;
  x+=`trailer\n<< /Size ${size} /Root ${T.root}${T.info?" /Info "+T.info:""} /Prev ${T.startxref} >>\nstartxref\n${pos}\n%%EOF\n`;
  out+=x;
  const tail=new Uint8Array(out.length); for(let i=0;i<out.length;i++) tail[i]=out.charCodeAt(i)&255;
  return new Blob([base,tail],{type:"application/pdf"});
}

function buildPpos(v,st){
  const vals=pposValues(v);
  const CN=["Principale","ST1","ST2","Secondaire"];
  const checked=[];
  for(const [id] of PPOS_RISKS){ const r=st.risks[id]; if(!r||!r.on) continue; checked.push("cb_"+id);
    const out=[]; for(let k=1;k<=4;k++){ if(r.c&&r.c[k]){ checked.push(`rc_${id}_${k}`); const nm=v[CN[k-1]]; if(nm) out.push(nm); } }
    vals["Resp_"+id]=out.join("\r\r"); }
  for(const [id] of PPOS_DOCS) if(st.docs[id]) checked.push(id);
  vals.DocAutre=st.docAutre||""; vals.CoactAutre=st.coactAutre||"";
  let pages=null;

    const T=window.PPOS_TPL, rem=new Set();

}

async function makeEml({to,subject,body,attachName,attach}){
  const ab=new Uint8Array(await attach.arrayBuffer()); let bin=""; for(let i=0;i<ab.length;i+=0x8000) bin+=String.fromCharCode.apply(null,ab.subarray(i,i+0x8000));

  const eml=[

    "Subject: "+enc(subject),

    `Content-Type: multipart/mixed; boundary="${bd}"`,
    "",
    "--"+bd,
    "Content-Type: text/plain; charset=UTF-8",
    "Content-Transfer-Encoding: base64",
    "",
    wrap76(b64utf8(body.replace(/\r?\n/g,"\r\n"))),
    "--"+bd,
    `Content-Type: application/pdf; name="${asciiName}"`,
    `Content-Disposition: attachment; filename="${asciiName}"; filename*=UTF-8''${encodeURIComponent(attachName)}`,
    "Content-Transfer-Encoding: base64",
    "",
    wrap76(btoa(bin)),
    "--"+bd+"--",
    ""].join("\r\n");

/* ---------- Génération .docx ---------- */
function xmlEsc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function runs(line){
  const parts=line.split(/(\*\*.+?\*\*)/g).filter(p=>p!=="");
  if(!parts.length) return "";
  return parts.map(p=>{ const b=/^\*\*(.+)\*\*$/.exec(p); const t=b?b[1]:p;
    return `<w:r><w:rPr>${b?"<w:b/>":""}</w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`; }).join("");
}
function crc32(buf){ let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++){ let c=(crc^buf[i])&0xFF; for(let k=0;k<8;k++) c=c&1?(c>>>1)^0xEDB88320:c>>>1; crc=(crc>>>8)^c; } return (crc^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  }
  const csize=central.reduce((t,x)=>t+x.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function makeDocx(text){
  const paras=text.split(/\r?\n/).map(l=>`<w:p><w:pPr><w:spacing w:after="0" w:line="276" w:lineRule="auto"/></w:pPr>${runs(l)}</w:p>`).join("");
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`;
  return makeZip([
    {name:"[Content_Types].xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`},
    {name:"_rels/.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`},
    {name:"word/_rels/document.xml.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"word/document.xml",text:doc},
    {name:"word/styles.xml",text:styles}
  ]);

}

  const nameKey=s=>nrm(s).split(" ").filter(Boolean).sort().join(" ");
  const exist=[...map.entries()].map(([id,c])=>({id,c}));
  const writes=[]; let added=0, completed=0;
  const F=["dc","rac","nature","regime","regime_date","icp","icp_faite","prescriptions","presc_dem","presc_ok","agglo","pmeo_mode","pmeo","rip","gdo","adresse","cp","commune","insee","ocb"];
  const fill=(c,r,isNew)=>{

async function runImport(payload,label,auto){
  const res=mergeImport(chantiers,payload,today());
  for(const w of res.writes){ chantiers.set(w.id,w.doc); await db.collection("chantiers").doc(w.id).set(JSON.parse(JSON.stringify(w.doc))); }
  renderList(); renderMain();

  const m=modal(`<div class="m-h"><h2>Import ${esc(label||"OneNote")} terminé</h2></div><div class="m-b"><p class="hint"><b>${res.added}</b> chantier(s) ajouté(s), <b>${res.completed}</b> complété(s). Rien n'a été effacé : les champs vides ont été remplis, les cases cochées et les notes / interlocuteurs manquants ajoutés, et les données venues du OneNote remises à la mise en forme de l'appli (nom du chantier, adresse, interlocuteurs).</p><p class="hint">Les affaires terminées sont rangées dans le groupe « Archive » (replié par défaut, clique dessus pour l'ouvrir).</p></div><div class="m-f"><button class="btn primary" data-x>OK</button></div>`,"sm");

function planDate(txt,ref){
  const m=String(txt||"").match(/(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/); if(!m) return null;
  const d=+m[1], mo=+m[2]; if(d<1||d>31||mo<1||mo>12) return null;
  let y=m[3]?+m[3]:ref.getFullYear(); if(y<100) y+=2000;
  let dt=new Date(y,mo-1,d); if(!m[3] && dt<new Date(ref.getTime()-180*864e5)) dt=new Date(y+1,mo-1,d);
  return dt;
}

function sigToJpeg(src,cb){ // src : canvas ou image ; recadre sur le tracé, fond blanc, 600 px max

const AUTO={h:null,st:"off",last:"",err:"",t:null,btn:null,KEY:(window.SC_STORE_KEY||"suivi_chantiers_donnees_v1")+"_auto",
  ok:()=>typeof window.showDirectoryPicker==="function",

    o.onsuccess=()=>{ const tx=o.result.transaction("h",mode), r=fn(tx.objectStore("h")); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }; }); },
  async load(){ if(!this.ok()) { this.st="na"; return; } try{ this.last=localStorage.getItem(this.KEY+"_last")||""; }catch{}
    try{ this.h=await this.idb("readonly",st=>st.get(AUTO.KEY))||null; }catch{ this.h=null; }
    if(!this.h){ this.st="off"; return; }
    let p="prompt"; try{ p=await this.h.queryPermission({mode:"readwrite"}); }catch{}
    this.st=p==="granted"?"on":"need"; if(this.st==="on") this.now(); },
  async choose(){ try{ const h=await window.showDirectoryPicker({id:"ingstudio",mode:"readwrite",startIn:"documents"});

    catch(e){ if(e?.name!=="AbortError"){ this.err=e?.message||String(e); } return false; } },
  async allow(){ if(!this.h) return this.choose(); try{ const p=await this.h.requestPermission({mode:"readwrite"}); this.st=p==="granted"?"on":"need"; if(this.st==="on") await this.now(); }catch(e){ this.err=e?.message||String(e); } this.ui(); return this.st==="on"; },
  async off(){ try{ await this.idb("readwrite",st=>st.delete(AUTO.KEY)); }catch{} this.h=null; this.st="off"; this.ui(); },
  soon(){ if(this.st!=="on") { this.ui(); return; } clearTimeout(this.t); this.t=setTimeout(()=>this.now(),2500); },
  async now(){ if(!this.h||!db?.exportAll) return; clearTimeout(this.t);
    try{ const txt=JSON.stringify({...db.exportAll(),savedAt:new Date().toISOString()},null,1);
      const w=async name=>{ const fh=await this.h.getFileHandle(name,{create:true}); const ws=await fh.createWritable(); await ws.write(new Blob([txt],{type:"application/json"})); await ws.close(); };
      await w("ING-STUDIO-sauvegarde.json"); await w(`ING-STUDIO-sauvegarde-${today()}.json`);
      // on garde les 10 dernières sauvegardes journalières

    catch(e){ if(e?.name==="NotAllowedError"||e?.name==="SecurityError") this.st="need"; else if(e?.name==="NotFoundError"){ this.st="need"; this.err="Dossier introuvable (déplacé ou supprimé ?)"; } else this.err=e?.message||String(e); }

  hm(){ if(!this.last) return ""; const d=new Date(this.last), t=new Date(); return d.toDateString()===t.toDateString()?d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}); },
  ui(){ const b=this.btn; if(!b) return; b.hidden=this.st==="na";
    const S={off:["⚠️"," Sauvegarde auto","Sauvegarde automatique non activée : clique pour choisir un dossier (OneDrive…)","auto-warn"],
      need:["🔄"," Réactiver la sauvegarde","Clique pour autoriser l'appli à enregistrer dans ton dossier de sauvegarde","auto-warn"],
      on:["✅"," Sauvegardé "+this.hm(),`Sauvegarde automatique dans « ${this.h?.name||""} »${this.last?" – dernière : "+new Date(this.last).toLocaleString("fr-FR"):""}`,"auto-ok"]}[this.st]||["","","",""];
    if(this.err&&this.st==="on"){ S[0]="⚠️"; S[1]=" Sauvegarde en erreur"; S[2]=this.err; S[3]="auto-warn"; }
    b.innerHTML=`${S[0]}<span class="lbl">${esc(S[1])}</span>`; b.title=S[2]; b.className="btn sm "+S[3]; },
  dialog(){ const st=this.st, fold=this.h?.name||"";
    const m=modal(`<div class="m-h"><h2>💾 Sauvegarde automatique</h2><button class="btn ghost sm" data-x aria-label="Fermer">✕</button></div>
      <div class="m-b" style="gap:10px">${st==="on"?`<p class="hint">Tes données sont enregistrées automatiquement dans le dossier <b>${esc(fold)}</b> à chaque modification${this.last?` (dernière sauvegarde : ${esc(new Date(this.last).toLocaleString("fr-FR"))})`:""}.</p>`
        :st==="need"?`<p class="hint">Edge demande ton accord pour continuer à enregistrer dans le dossier <b>${esc(fold)}</b>. Clique sur « Réactiver », puis sur <b>Autoriser</b> (choisis « Autoriser à chaque visite » si Edge le propose : tu n'auras plus à le refaire).</p>${this.err?`<p class="msg err">${esc(this.err)}</p>`:""}`
        :`<p class="hint">Choisis un dossier, de préférence dans ton <b>OneDrive</b> (ex. « OneDrive – Enedis\\ING STUDIO »). L'appli y enregistrera toute seule tes affaires après chaque modification :</p>
          <ul class="hint" style="margin:0 0 0 18px"><li><b>ING-STUDIO-sauvegarde.json</b> : la dernière version</li><li>une copie par jour (les 10 derniers jours sont gardés)</li></ul>
          <p class="hint">En cas de problème (changement de PC, Edge vidé…), « 📂 Restaurer » et choisis ce fichier.</p>`}</div>
      <div class="m-f"><span class="msg" id="au_msg"></span>${st==="on"?`<button class="btn" data-off>Désactiver</button><button class="btn" data-ch>Changer de dossier</button><button class="btn primary" data-now>Sauvegarder maintenant</button>`
        :st==="need"?`<button class="btn" data-ch>Changer de dossier</button><button class="btn primary" data-al>Réactiver</button>`:`<button class="btn" data-x2>Plus tard</button><button class="btn primary" data-ch>Choisir le dossier</button>`}</div>`,"sm");
    const msg=m.querySelector("#au_msg"), done=ok=>{ if(ok){ closeModal(); } else if(this.err){ msg.textContent=this.err; msg.className="msg err"; } };
    m.querySelectorAll("[data-x],[data-x2]").forEach(b=>b.onclick=closeModal);
    const q=s=>m.querySelector(s);
    if(q("[data-ch]")) q("[data-ch]").onclick=async()=>done(await this.choose());
    if(q("[data-al]")) q("[data-al]").onclick=async()=>done(await this.allow());
    if(q("[data-off]")) q("[data-off]").onclick=async()=>{ await this.off(); closeModal(); };
    if(q("[data-now]")) q("[data-now]").onclick=async()=>{ await this.now(); msg.textContent=this.err||"Sauvegarde faite."; msg.className="msg "+(this.err?"err":"ok"); };
    this.ui(); }

function makeLocalDB(){
  const KEY=window.SC_STORE_KEY||"suivi_chantiers_donnees_v1";
  let data=null; try{ data=JSON.parse(localStorage.getItem(KEY)||"null"); }catch{}
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); lastErr=null; }catch(e){ lastErr="Le navigateur refuse d'enregistrer (stockage plein ou bloqué)"; } setSave(); AUTO.soon(); };
  if(!data||!data.chantiers){ data=window.SC_SEED?JSON.parse(JSON.stringify(window.SC_SEED)):{chantiers:{},config:{}}; persist(); }
  data.config=data.config||{};
  const snap=(id,o)=>({id,exists:o!=null,data:()=>o,metadata:{fromCache:false,hasPendingWrites:false}});
  const colSnap=()=>({docs:Object.entries(data.chantiers).map(([id,o])=>snap(id,o)),metadata:{fromCache:false}});
  return {
    collection:()=>({
      doc:(id)=>{ id=id||("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)); return {id, set:async o=>{ data.chantiers[id]=o; persist(); }, delete:async()=>{ delete data.chantiers[id]; persist(); }}; },
      get:async()=>colSnap(),
      onSnapshot:(n)=>{ setTimeout(()=>n(colSnap()),0); return ()=>{}; }
    }),
    doc:(path)=>{ const k=path.split("/")[1]; return { onSnapshot:(n)=>{ setTimeout(()=>n(snap(k,data.config[k]??null)),0); return ()=>{}; }, set:async o=>{ data.config[k]=o; persist(); } }; },
    exportAll:()=>JSON.parse(JSON.stringify(data)),
    importAll:(d)=>{ data=d; persist(); }
  };
}

  if(!html||!all.length) html=all.length?`<p class="ph-empty">Aucune affaire trouvée.</p>`:`<p class="ph-empty">Aucune affaire ici. Charge ta sauvegarde <b>ING-STUDIO-sauvegarde.json</b> depuis ton OneDrive avec le bouton ci-dessous.</p>`;
  el.innerHTML=html;
}
function phDetail(c){
  const a=fullAddr(c), maps=a?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a)}`:"";
  const cs=(c.contacts||[]).filter(x=>x.nom||x.raison||x.tel||x.mail);
  const card=(nom,sub,tel,mail)=>`<div class="ph-card"><div class="ph-cn"><b>${esc(nom||"—")}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>
    ${tel?`<div class="ph-telrow"><a class="ph-act tel" href="tel:${esc(phTel(tel))}" target="_blank" rel="noopener" data-tel="${esc(phTel(tel))}">📞 ${esc(tel)}</a><button class="ph-copy" data-ph="copy" data-v="${esc(tel)}">Copier</button></div>`:""}${mail?`<a class="ph-act mail" href="mailto:${esc(mail)}" target="_blank" rel="noopener">✉ ${esc(mail)}</a>`:""}</div>`;
  const pl=(c.planning||[]).filter(p=>p.etape||p.date);
  const kv=[["Statut",c.statut],["Début travaux",frDate(c.date_debut)],["Fin travaux",frDate(c.date_fin)],["Régime",c.regime==="PPOS diffusé"?"PPOS diffusé"+(c.regime_date?" le "+frDate(c.regime_date):""):c.regime],
    ["PMEO",c.pmeo_mode==="sans"?"Sans PMEO":c.pmeo_mode==="le"?"le "+frDate(c.pmeo):c.pmeo_mode==="faite"?"faite le "+frDate(c.pmeo):""],["Client",c.client],["Code GDO poste",c.gdo]].filter(x=>x[1]);
  const notes=(c.notes||[]).filter(n=>n.t&&n.t.trim()).sort((x,y)=>(y.imp?1:0)-(x.imp?1:0));
  const prm=(c.prm||[]).filter(p=>p.bat||p.lot||p.prm);
  return `<header class="ph-top ph-dt"><button class="ph-back" data-ph="back">‹ Affaires</button>
    <h1>${esc([c.dc,c.rac].filter(Boolean).join(" / ")||"Affaire")}</h1><p class="ph-nat">${esc(c.nature||"")}</p>
    ${a?`<a class="ph-addr" href="${esc(maps)}" target="_blank" rel="noopener">📍 ${esc(a)}</a><div class="ph-nav"><a class="ph-act waze" href="${esc(wazeUrl(c,a))}" target="_blank" rel="noopener">🚗 Waze</a><a class="ph-act gmaps" href="${esc(maps)}" target="_blank" rel="noopener">🗺 Maps</a><button class="ph-act ph-cpa" data-ph="copy" data-v="${esc(a)}">📋 Copier</button></div>`:""}<div class="ph-chips">${stateChips(c,true)}</div></header>
    <main class="ph-main">
    <section><h2>Interlocuteurs</h2>${cs.length?cs.map(x=>card(x.nom,x.raison,x.tel,x.mail)).join(""):`<p class="ph-empty">Aucun interlocuteur.</p>`}
      ${c.rip||c.rip_tel?card(c.rip,"RIP",c.rip_tel,""):""}</section>
    <section><h2>Planning</h2>${pl.length?`<table class="ph-tbl"><tbody>${pl.map(p=>`<tr><td>${esc(p.etape)}</td><td>${esc(/^\d{4}-\d{2}-\d{2}$/.test(p.date||"")?frDate(p.date):p.date)}</td></tr>`).join("")}</tbody></table>`:`<p class="ph-empty">Planning vide.</p>`}</section>
    ${kv.length?`<section><h2>Infos</h2><dl class="ph-kv">${kv.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>`:""}
    ${notes.length?`<section><h2>Notes</h2>${notes.map(n=>`<p class="ph-note${n.imp?" imp":""}${n.task&&n.done?" tdone":""}">${n.task?`<span class="ph-task">⏰ ${n.done?"faite":isoD(n.due)?"pour le "+frDate(n.due)+" · "+taskWhen(taskJ(n)):"date ?"}</span>`:""}${esc(n.t)}</p>`).join("")}</section>`:""}
    ${prm.length?`<section><h2>PRM</h2><table class="ph-tbl"><thead><tr><th>Bâtiment</th><th>Lot</th><th>N° PRM</th></tr></thead><tbody>${prm.map(p=>`<tr><td>${esc(p.bat)}</td><td>${esc(p.lot)}</td><td>${esc(p.prm)}</td></tr>`).join("")}</tbody></table></section>`:""}
    </main>`;
}
function phClick(e){
  const b=e.target.closest("[data-ph]"); if(!b) return; const a=b.dataset.ph;
  if(a==="tab"){ PH.tab=b.dataset.t; renderPhone(); }
  else if(a==="open"){ PH.id=b.dataset.id; try{ history.pushState({ph:1},""); }catch{} renderPhone(); window.scrollTo(0,0); }
  else if(a==="back"){ if(history.state?.ph) history.back(); else { PH.id=null; renderPhone(); } }
  else if(a==="arch"){ PH.arch=true; phList(); }
  else if(a==="copy"){ const v=b.dataset.v, lab=b.textContent; const ok=()=>{ b.textContent="Copié ✓"; setTimeout(()=>b.textContent=lab,1800); };
    const fb=()=>{ const t=document.createElement("textarea"); t.value=v; t.setAttribute("readonly",""); t.style.cssText="position:fixed;opacity:0;top:0"; document.body.appendChild(t); t.select(); t.setSelectionRange(0,99); try{ document.execCommand("copy"); ok(); }catch{ prompt("Numéro :",v); } t.remove(); };
    try{ navigator.clipboard.writeText(v).then(ok,fb); }catch{ fb(); } }
  else if(a==="unsnap"){ PH.snap=null; try{ localStorage.removeItem("ing_phone_snap"); }catch{} renderPhone(); }
  else if(a==="full"){ try{ localStorage.setItem("sc_full","1"); }catch{} location.reload(); }
}
document.addEventListener("change",e=>{ if(e.target.classList?.contains("ph-file")&&e.target.files[0]){ phLoadFile(e.target.files[0]); e.target.value=""; } });

if(IS_MOBILE&&!PHONE&&!window.SC_PHONE_APP){ setTimeout(()=>{ const b=document.createElement("button"); b.className="ph-back2"; b.textContent="📱 Version téléphone"; b.onclick=()=>{ try{ localStorage.removeItem("sc_full"); }catch{} location.reload(); }; document.body.appendChild(b); },0); }
/* ---------- Démarrage ---------- */
try{ tab=localStorage.getItem("sc_tab")||tab; }catch{}
renderTabs(); setSave();
(async()=>{
  const cl=window.claude;
  if(!cl?.use){ LOCAL=true; db=makeLocalDB(); downloads=localDownloads; diag("db","local"); setupLocalUI(); boot(db); return; }
  diag("db","en attente");
  [db,downloads]=await Promise.all([cl.use("db").catch(()=>null), cl.use("downloads").catch(()=>null)]);
  diag("db", db?`ok (${((Date.now()-DIAG.t0)/1000).toFixed(1)} s)`:"indisponible");
  boot(db);
})();
function boot(d){
  setSave();
  if(!d){ $("#list").innerHTML=`<p class="hint" style="padding:14px">Les données ne sont pas accessibles dans cette vue (aperçu ou session déconnectée). Ouvre l'appli depuis claude.ai, connecté à ton compte.</p>`; return; }
  let first=true, tries=0;
  d.doc("config/annuaire_rip").onSnapshot(s=>{ if(s.exists){ const it=s.data().items; ANNU_RIP=Array.isArray(it)?JSON.parse(JSON.stringify(it)):[]; } },()=>{});
  d.doc("config/annuaire").onSnapshot(s=>{ if(s.exists){ const it=s.data().items; ANNU=Array.isArray(it)?it.map(x=>({...x,_n:nrm([x.n,x.e,x.f,x.k,x.m].join(" "))})):[]; } },()=>{});
  let profChecked=false;
  const checkProfile=()=>{ if(profChecked||PHONE) return; profChecked=true; if(!(settings.moi_nom||"").trim()) setTimeout(()=>openProfile(true),400); };
  setTimeout(checkProfile,4000);
  d.doc("config/settings").onSnapshot(s=>{ setTimeout(checkProfile,0); if(s.exists){ settings={...DEFAULT_SETTINGS,...JSON.parse(JSON.stringify(s.data()))}; if(settings.tpl_mail_ppos) settings.tpl_mail_ppos=settings.tpl_mail_ppos.replace("Bonjour {{destinataire_contact}},","Bonjour,"); } },()=>{});
  const apply=(docs, authoritative)=>{
    const seen=new Set();
    for(const doc of docs){
      const id=doc.id; seen.add(id);
      if(timers[id+"_p"] || doc.metadata?.hasPendingWrites) continue; // modif locale en cours : on garde la version de l'écran
      const data=doc.data(); if(!data) continue;
      const before=chantiers.get(id);
      chantiers.set(id,norm(data));
      if(id===currentId && !first && before && !$("#main").contains(document.activeElement)) renderMain();
    }
    if(authoritative){ for(const id of [...chantiers.keys()]) if(!seen.has(id) && !timers[id+"_p"] && !String(id).startsWith("local")) chantiers.delete(id); }
    if(first && (authoritative || chantiers.size) && LOCAL && window.SC_IMPORT){ const k="sc_import_"+window.SC_IMPORT.id; let done=false; try{ done=!!localStorage.getItem(k); }catch{} if(!done){ try{ localStorage.setItem(k,today()); }catch{} setTimeout(()=>runImport(window.SC_IMPORT,window.SC_IMPORT.source,true),50); } }
    if(first && (authoritative || chantiers.size)){ first=false; loaded=true; try{ const s=localStorage.getItem("sc_cur"); if(s&&chantiers.has(s)){ currentId=s; tab=chantiers.get(s).type; autoInsee(s); remember(s); } }catch{} renderMain(); restoreScroll(); }
    if(currentId && !chantiers.has(currentId)){ currentId=null; renderMain(); }
    renderList();
  };
  // lecture directe au démarrage (ne dépend pas de l'abonnement)
  d.collection("chantiers").get().then(snap=>{ diag("get",`${snap.docs.length} fiches (${((Date.now()-DIAG.t0)/1000).toFixed(1)} s)`); try{ apply(snap.docs,true); }catch(err){ diag("get","erreur affichage: "+err.message); } }).catch(e=>{ diag("get","erreur "+(e?.code||e?.message)); lastErr=e?.message||e?.code; setSave(); });
  const subscribe=()=>{
    d.collection("chantiers").onSnapshot(snap=>{ tries=0; diag("snap",`${snap.docs.length} fiches${snap.metadata?.fromCache?" (cache)":""}`); try{ apply(snap.docs, !snap.metadata?.fromCache); }catch(err){ diag("snap","erreur affichage: "+err.message); } },
      e=>{ diag("snap","erreur "+(e?.code||e?.message)); if(++tries<=5){ setTimeout(subscribe, 2000*tries); } else { lastErr=e?.message||e?.code; setSave(); } });
  };
  subscribe();
}
</script>
